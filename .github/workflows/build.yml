name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_15.4.app/Contents/Developer"
            echo "使用 Xcode 15.4"
          else
            LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            sudo xcode-select -s "$LATEST/Contents/Developer"
            echo "15.4不存在，使用 $LATEST"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unzip Project
        run: |
          if [ -f app.zip ]; then
            unzip -o app.zip -d .
            echo "解压完成"
          fi
      - name: Locate Project
        id: locate
        run: |
          PROJECT_DIR=$(find . -name "project.yml" -not -path "*/.git/*" | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "未找到 project.yml"
            find . -not -path "*/.git/*" -type f | head -30
            exit 1
          fi
          echo "项目目录: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
      - name: Generate Xcode Project
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          xcodegen generate
      - name: Build
        timeout-minutes: 10
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          xcodebuild \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -30
      - name: Package IPA
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -r Ledger.ipa Payload
          ls -lh Ledger.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Ledger.ipa
          path: ${{ steps.locate.outputs.project_dir }}/Ledger.ipa
